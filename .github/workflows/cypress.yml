name: Cypress E2E

on:
  push:
  schedule:
    - cron: '0 18 * * *' # 15:00 America/Sao_Paulo (UTC-3)
    - cron: '30 20 * * *' # 17:30 America/Sao_Paulo (UTC-3)

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar todos os testes E2E
        run: npm run cy:run