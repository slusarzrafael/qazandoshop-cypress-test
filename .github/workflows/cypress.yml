name: Cypress E2E

on:
  push:
  schedule:
    - cron: '0 18 * * *' # 15:00 America/Sao_Paulo (UTC-3)
    - cron: '30 20 * * *' # 17:30 America/Sao_Paulo (UTC-3)

permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    environment: CYPRESS_RECORD_KEY
    strategy:
      # Evita que o Cypress Cloud fique "em execução" se um worker falhar (cypress-io/github-action#48)
      fail-fast: false
      matrix:
        containers: [1, 2]
    env:
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validar configuração do Cypress Cloud
        run: |
          test -n "$CYPRESS_RECORD_KEY" || { echo "::error::Configure o secret CYPRESS_RECORD_KEY no Environment CYPRESS_RECORD_KEY."; exit 1; }

      - name: Executar testes E2E no Cypress Cloud
        uses: cypress-io/github-action@v7
        with:
          record: true
          parallel: true
          group: 'Suíte completa'